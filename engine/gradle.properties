# sherpa-onnx Android AAR, downloaded at build time (not stored in Git).
# Pick a release asset from https://github.com/k2-fsa/sherpa-onnx/releases and fill in
# its URL and SHA-256. The build stops with a clear message while these are empty.
sherpaOnnxAarUrl=
sherpaOnnxAarSha256=
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
