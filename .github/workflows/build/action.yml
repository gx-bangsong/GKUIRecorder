name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleDebug

    - name: Generate Android.bp
      shell: bash
      run: |
        ./gradlew app:generateBp
        if [[ ! -z $(git status -s) ]]; then
          git status
          exit -1
        fi

    - name: Build legacy release
      shell: bash
      run: ./gradlew assembleRelease

    - name: Check legacy application IDs and shortcut target
      shell: bash
      run: |
        set -euo pipefail
        APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
        AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1)"
        check_id() {
          local apk="$1" expected="$2" actual
          actual="$("$APKANALYZER" manifest application-id "$apk")"
          if [ "$actual" != "$expected" ]; then
            echo "$apk: applicationId is $actual, expected $expected" >&2
            exit 1
          fi
        }
        check_target() {
          local apk="$1" expected="$2"
          if ! "$AAPT2" dump resources "$apk" | grep -A3 'shortcut_target_package' | grep -q "$expected"; then
            echo "$apk: shortcut targetPackage is not $expected" >&2
            exit 1
          fi
        }
        LEGACY_RELEASE="$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)"
        check_id app/build/outputs/apk/debug/app-debug.apk org.lineageos.recorder.dev
        check_id "$LEGACY_RELEASE" org.lineageos.recorder
        check_target app/build/outputs/apk/debug/app-debug.apk org.lineageos.recorder.dev
        echo "legacy application IDs verified"

    - uses: actions/upload-artifact@v7
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        archive: false

    - name: Build standalone distribution
      shell: bash
      run: ./gradlew -Pdistribution=standalone assembleDebug assembleRelease

    - name: Check standalone application IDs and shortcut target
      shell: bash
      run: |
        set -euo pipefail
        APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
        AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1)"
        check_id() {
          local apk="$1" expected="$2" actual
          actual="$("$APKANALYZER" manifest application-id "$apk")"
          if [ "$actual" != "$expected" ]; then
            echo "$apk: applicationId is $actual, expected $expected" >&2
            exit 1
          fi
        }
        check_target() {
          local apk="$1" expected="$2"
          if ! "$AAPT2" dump resources "$apk" | grep -A3 'shortcut_target_package' | grep -q "$expected"; then
            echo "$apk: shortcut targetPackage is not $expected" >&2
            exit 1
          fi
        }
        check_id app/build/outputs/apk/debug/app-standalone-debug.apk io.github.gxbangsong.gkuirecorder.dev
        check_id app/build/outputs/apk/release/app-standalone-release.apk io.github.gxbangsong.gkuirecorder
        check_target app/build/outputs/apk/debug/app-standalone-debug.apk io.github.gxbangsong.gkuirecorder.dev
        check_target app/build/outputs/apk/release/app-standalone-release.apk io.github.gxbangsong.gkuirecorder
        "$APKANALYZER" manifest print app/build/outputs/apk/release/app-standalone-release.apk > standalone-manifest.xml
        grep -q 'org.lineageos.recorder.ListActivity' standalone-manifest.xml
        ! grep -q 'android:authorities=.*lineageos' standalone-manifest.xml
        rm -f standalone-manifest.xml
        echo "standalone application IDs verified"

    - uses: actions/upload-artifact@v7
      with:
        name: standalone-apks
        path: app/build/outputs/apk/*/app-standalone-*.apk
        archive: false
