name: unit-test

# Separate from build.yml, which is left unchanged. Runs the JVM unit tests and Android lint.
# Each step runs even when an earlier one fails, so both results are reported.

on: [push, pull_request, workflow_dispatch]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Unit tests
      id: unit
      shell: bash
      run: |
        set -o pipefail
        ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log

    - name: Unit test failure lines as annotations
      if: failure() && steps.unit.outcome == 'failure'
      shell: bash
      run: |
        # Full log is in the uploaded artifact. Annotations give the failing lines in the check run.
        grep -E '^e: |FAILED|AssertionError|Exception|What went wrong|^[A-Za-z0-9_.]+ > .*' -A2 unit-test.log \
          | head -n 120 \
          | while IFS= read -r line; do
              msg="${line//'%'/%25}"
              echo "::error title=unit-test::${msg}"
            done

    - name: Lint
      if: always()
      run: ./gradlew :app:lintDebug --stacktrace

    - name: Upload test and lint reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-reports
        path: |
          unit-test.log
          app/build/reports/tests/
          app/build/test-results/
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
        if-no-files-found: ignore
        retention-days: 7
