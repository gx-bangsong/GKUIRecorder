name: emulator-test

# Instrumented tests on an x86_64 emulator with hardware acceleration (KVM).
# The matrix runs one job per API level in parallel. fail-fast is off, so one failing level does
# not cancel the other. Manual and pull request runs only: an emulator run is much slower than the
# JVM unit tests in unit-test.yml.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 31 = minSdk, 35 = recent stable. Both use the google_apis x86_64 image.
        api-level: [31, 35]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Instrumented tests
      id: instrumented
      # Bounded: a hung instrumentation run still lets the evidence step run
      timeout-minutes: 25
      env:
        GH_TOKEN: ${{ github.token }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        disable-spellchecker: true
        # The exit code of gradle still decides the step result; the copy never hides it.
        script: sh scripts/emulator-run.sh
    # Separate step: the annotations of the emulator step are capped, which hid the blob ids.
    - name: Return evidence as Git blobs
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: sh scripts/emulator-evidence.sh
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: emulator-reports-api${{ matrix.api-level }}
        if-no-files-found: ignore
        path: |
          app/build/reports/androidTests/connected/**
          app/build/outputs/androidTest-results/connected/**
    - name: Upload highlight evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: highlight-evidence-api${{ matrix.api-level }}
        if-no-files-found: ignore
        path: highlight-evidence/**
