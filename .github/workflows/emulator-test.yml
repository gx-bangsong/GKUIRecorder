name: emulator-test

# Instrumented tests on an x86_64 emulator with hardware acceleration (KVM).
# The matrix runs one job per API level in parallel. fail-fast is off, so one failing level does
# not cancel the other. Manual and pull request runs only: an emulator run is much slower than the
# JVM unit tests in unit-test.yml.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 31 = minSdk, 35 = recent stable. Both use the google_apis x86_64 image.
        api-level: [31, 35]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Instrumented tests
      id: instrumented
      env:
        GH_TOKEN: ${{ github.token }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        disable-spellchecker: true
        # The emulator stops when this script ends, so the evidence is copied out here.
        # The exit code of gradle still decides the step result; the copy never hides it.
        script: |
          # Plain POSIX sh: the runner executes this script with /bin/sh, not bash.
          # Each stage prints a notice, so a failure shows how far the script got.
          # The gradle exit code decides the step result; nothing below hides it.
          set +e
          echo "::notice title=stage::start in $(pwd)"
          ls gradlew > /dev/null 2>&1 || echo "::error title=stage::gradlew not found"
          ./gradlew :app:connectedDebugAndroidTest --stacktrace > gradle-emulator.log 2>&1
          status=$?
          echo "::notice title=stage::gradle exit $status, $(wc -l < gradle-emulator.log) lines"
          annotate() {
            sed 's/%/%25/g' | while IFS= read -r line; do
              printf '::error title=%s::%s\n' "$1" "$line"
            done
          }
          tail -n 60 gradle-emulator.log | annotate gradle
          adb=$(command -v adb || echo "$ANDROID_HOME/platform-tools/adb")
          "$adb" logcat -d | grep -E 'GKUI_HL|AndroidRuntime' | tail -n 80 | annotate logcat
          # Android 11+ blocks shell access to Android/data, so the debuggable app's files are read with run-as.
          mkdir -p highlight-evidence
          for f in results.txt gap-2500.png; do
            "$adb" exec-out run-as org.lineageos.recorder.dev cat "files/highlight-evidence/$f" > "highlight-evidence/$f" 2>/dev/null
            if [ -s "highlight-evidence/$f" ]; then
              # Evidence as a Git blob (the same way the UI workflow reference returns evidence)
              base64 -w0 "highlight-evidence/$f" > "highlight-evidence/$f.b64"
              sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f encoding=base64 -F "content=@highlight-evidence/$f.b64" --jq .sha 2>/dev/null)
              echo "::notice title=evidence-blob::$f $sha"
            else
              echo "::warning::could not read $f from the emulator"
            fi
          done
          exit $status

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: emulator-reports-api${{ matrix.api-level }}
        if-no-files-found: ignore
        path: |
          app/build/reports/androidTests/connected/**
          app/build/outputs/androidTest-results/connected/**
    - name: Upload highlight evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: highlight-evidence-api${{ matrix.api-level }}
        if-no-files-found: ignore
        path: highlight-evidence/**
