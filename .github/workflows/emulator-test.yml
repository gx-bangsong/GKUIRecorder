name: emulator-test

# Instrumented tests on an x86_64 emulator with hardware acceleration (KVM).
# The matrix runs one job per API level in parallel. fail-fast is off, so one failing level does
# not cancel the other. Manual and pull request runs only: an emulator run is much slower than the
# JVM unit tests in unit-test.yml.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 31 = minSdk, 35 = recent stable. Both use the google_apis x86_64 image.
        api-level: [31, 35]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Instrumented tests
      id: instrumented
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: google_apis
        profile: pixel_6
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        disable-spellchecker: true
        # The emulator stops when this script ends, so the evidence is copied out here.
        # The exit code of gradle still decides the step result; the copy never hides it.
        script: |
          set +e
          ./gradlew :app:connectedDebugAndroidTest --stacktrace
          status=$?
          # Android 11+ blocks shell access to Android/data, so the debuggable app's files are read with run-as.
          adb=$(command -v adb || echo "$ANDROID_HOME/platform-tools/adb")
          mkdir -p highlight-evidence
          for f in results.txt gap-2500.png; do
            "$adb" exec-out run-as org.lineageos.recorder.dev cat "files/highlight-evidence/$f" > "highlight-evidence/$f" \
              || echo "::warning::could not read $f from the emulator"
          done
          # The same rows as annotations, so they can be read without the artifact
          "$adb" logcat -d -s GKUI_HL:I | sed -n 's/.*GKUI_HL: /::notice title=highlight::/p'
          exit $status

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: emulator-reports-api${{ matrix.api-level }}
        if-no-files-found: ignore
        path: |
          app/build/reports/androidTests/connected/**
          app/build/outputs/androidTest-results/connected/**
    - name: Upload highlight evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: highlight-evidence-api${{ matrix.api-level }}
        if-no-files-found: ignore
        path: highlight-evidence/**
